<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceHLS Viewer</title>

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- Vidstack Styles & Script -->
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
    <script src="https://cdn.vidstack.io/player" type="module"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AceHLS</h1>
        <div class="controls">
            <div class="filter-container">
                <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
                <select id="categorySelect" onchange="filterChannels()">
                    <option value="all">Todas las categorías</option>
                    <option value="favorites">⭐ Favoritos</option>
                </select>
            </div>
            <div class="filter-container">
                <input type="text" id="manualAceId" placeholder="Pegar AceStream ID manual..." style="flex-grow: 2;">
                <button onclick="playManual()">Reproducir ID</button>
            </div>
            <div class="action-buttons">
                <button onclick="toggleTheme()" class="theme-btn" title="Cambiar Tema" id="theme-icon">🌓</button>
                <button onclick="loadChannels()">Refrescar</button>
                <a href="/playlist.m3u" target="_blank" class="download-link">M3U</a>
            </div>
        </div>
    </header>

    <div id="channel-grid">
        <div class="loading" style="text-align:center;">Cargando canales...</div>
    </div>

    <!-- Modal with Vidstack -->
    <div id="player-modal">
        <div id="player-container">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h2 id="player-title" style="color:white; margin:0 0 10px 0; text-align: center;"></h2>

            <div id="player-error"
                style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; z-index:10; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
                <div style="font-size:3rem; margin-bottom:10px;">⚠️</div>
                <div style="font-size:1.2rem; font-weight:bold;">Stream no disponible</div>
                <div style="color:#aaa; margin-top:5px;">No hay fuentes (seeds) o el canal está off-line.<br>Prueba otro
                    canal.</div>
            </div>

            <media-player id="player" title="AceHLS Stream" aspect-ratio="16/9" loop>
                <media-provider></media-provider>
                <media-video-layout></media-video-layout>
            </media-player>

            <div class="utility-box">
                <div><strong>Opciones de Reproducción:</strong></div>

                <!-- iOS Native Button -->
                <button id="ios-btn" class="utility-btn btn-ios" onclick="playNativeIOS()" style="display:none;">
                    Usar Reproductor Nativo
                </button>

                <!-- VLC Copy Button -->
                <a id="vlc-link" href="#" onclick="copyToClipboard(event, this)" class="utility-btn btn-vlc">
                    🔗 Copiar Enlace VLC (Directo)
                </a>
            </div>
        </div>
    </div>

    <footer>
        <small>AceHLS Viewer <span id="version-display"></span></small>
    </footer>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
