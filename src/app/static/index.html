<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceHLS Viewer</title>

    <!-- Vidstack Styles & Script -->
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
    <script src="https://cdn.vidstack.io/player" type="module"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --ios-color: #007aff;
            --card-hover: #2c2c2c;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* Vidstack Player Customization */
        media-player {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: black;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Layout & Grid */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        input,
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: var(--input-bg);
            color: white;
        }

        input {
            flex-grow: 1;
            min-width: 200px;
        }

        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
        }

        button:hover {
            opacity: 0.8;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .download-link {
            background: #333;
            color: var(--accent-color);
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid var(--accent-color);
        }

        #channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .channel-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .channel-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
        }

        .channel-logo {
            max-width: 80px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .channel-name {
            font-size: 0.9rem;
            font-weight: 500;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Modal */
        #player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #player-container {
            width: 90%;
            max-width: 1100px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            color: white;
            font-size: 2rem;
            padding: 0;
            cursor: pointer;
        }

        /* Utility Links */
        .utility-box {
            text-align: center;
            margin-top: 15px;
            color: #ccc;
            font-size: 0.9rem;
            background: #333333;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .utility-btn {
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            padding: 8px 15px;
            display: inline-block;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .utility-btn:hover {
            opacity: 0.8;
        }

        .btn-vlc {
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            background: transparent;
        }

        .btn-ios {
            color: white;
            background: var(--ios-color);
            border: none;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>AceHLS</h1>
        <div class="controls">
            <div class="filter-container">
                <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
                <select id="categorySelect" onchange="filterChannels()">
                    <option value="all">Todas las categorías</option>
                </select>
            </div>
            <div class="filter-container">
                <input type="text" id="manualAceId" placeholder="Pegar AceStream ID manual..." style="flex-grow: 2;">
                <button onclick="playManual()">Reproducir ID</button>
            </div>
            <div class="action-buttons">
                <button onclick="loadChannels()">Refrescar</button>
                <a href="/playlist.m3u" target="_blank" class="download-link">M3U</a>
            </div>
        </div>
    </header>

    <div id="channel-grid">
        <div class="loading" style="text-align:center;">Cargando canales...</div>
    </div>

    <!-- Modal with Vidstack -->
    <div id="player-modal">
        <div id="player-container">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h2 id="player-title" style="color:white; margin:0 0 10px 0; text-align: center;"></h2>

            <div id="player-error"
                style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; z-index:10; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
                <div style="font-size:3rem; margin-bottom:10px;">⚠️</div>
                <div style="font-size:1.2rem; font-weight:bold;">Stream no disponible</div>
                <div style="color:#aaa; margin-top:5px;">No hay fuentes (seeds) o el canal está off-line.<br>Prueba otro
                    canal.</div>
            </div>

            <media-player id="player" title="AceHLS Stream" aspect-ratio="16/9" loop>
                <media-provider></media-provider>
                <media-video-layout></media-video-layout>
            </media-player>

            <div class="utility-box">
                <div><strong>Opciones de Reproducción:</strong></div>

                <!-- iOS Native Button -->
                <button id="ios-btn" class="utility-btn btn-ios" onclick="playNativeIOS()" style="display:none;">
                    Usar Reproductor Nativo
                </button>

                <!-- VLC Copy Button -->
                <a id="vlc-link" href="#" onclick="copyToClipboard(event, this)" class="utility-btn btn-vlc">
                    🔗 Copiar Enlace VLC (Directo)
                </a>
            </div>
        </div>
    </div>

    <footer>
        <small>AceHLS Viewer <span id="version-display"></span></small>
    </footer>

    <script>
        let allChannels = [];
        let categories = new Set();
        let currentStreamUrl = "";
        const player = document.querySelector('media-player');

        async function loadChannels() {
            try {
                // Version
                fetch('/api/version').then(r => r.json()).then(d => document.getElementById('version-display').textContent = d.version).catch(e => { });

                const grid = document.getElementById('channel-grid');
                grid.innerHTML = '<div style="text-align:center;">Actualizando canales...</div>';

                const response = await fetch('/api/channels');
                if (!response.ok) throw new Error('Error de red');
                allChannels = await response.json();

                categories.clear();
                allChannels.forEach(ch => { if (ch.group) categories.add(ch.group); });
                populateCategoryDropdown();
                filterChannels();

            } catch (e) {
                document.getElementById('channel-grid').innerHTML = `<div style="text-align:center;color:red;">Error: ${e.message}</div>`;
            }
        }

        function populateCategoryDropdown() {
            const select = document.getElementById('categorySelect');
            const current = select.value;
            select.innerHTML = '<option value="all">Todas las categorías</option>';
            Array.from(categories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; opt.textContent = cat;
                select.appendChild(opt);
            });
            if (categories.has(current)) select.value = current;
        }

        function filterChannels() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categorySelect').value;
            const filtered = allChannels.filter(ch =>
                ch.name.toLowerCase().includes(search) && (cat === 'all' || ch.group === cat)
            );

            const grid = document.getElementById('channel-grid');
            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;">No hay resultados</div>';
                return;
            }

            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => playChannel(ch);

                const logo = ch.logo ? `<img src="${ch.logo}" class="channel-logo" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdGggZmlsbD0iIzU1NSIgZD0iTTIxIDNIM2MtMS4xIDAtMiAuOS0yIDJ2MTJjMCAxLjEuOSAyIDIgMmg1bDIgM2g0bDItM2g1YzEuMSAwIDItLjkgMi0yVjVjMC0xLjEtLjktMi0yLTJ6bTAgMTRIM1Y1aDE4djEyem0tNS02bC03IDRWM2zNyA0eiIvPjwvc3ZnPg=='">` : '<div style="font-size:2rem;">📺</div>';

                card.innerHTML = `${logo}<div class="channel-name">${ch.name}</div>`;
                grid.appendChild(card);
            });
        }

        function isIOS() {
            return [
                'iPad Simulator', 'iPhone Simulator', 'iPod Simulator', 'iPad', 'iPhone', 'iPod'
            ].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);
        }

        let loadTimeout;

        async function playChannel(channel) {
            const modal = document.getElementById('player-modal');
            const errorDiv = document.getElementById('player-error');
            errorDiv.style.display = 'none'; // Reset error

            document.getElementById('player-title').textContent = channel.name;

            // Setup VLC Link
            const vlcLink = document.getElementById('vlc-link');
            if (vlcLink) {
                // If channel.url is missing (manual entries), try to guess or use ID
                let vlcUrl = channel.url;
                vlcLink.setAttribute('data-url', vlcUrl); // Store for copy
                vlcLink.href = vlcUrl || '#';
                vlcLink.textContent = "🔗 Copiar Enlace VLC (Directo)";
            }

            // Setup iOS Button
            const iosBtn = document.getElementById('ios-btn');
            if (isIOS() || true) { // Always show for now to debug/fallback
                iosBtn.style.display = 'inline-block';
            }

            modal.style.display = 'flex';

            try {
                // Request stream start
                const res = await fetch(`/api/hls/start/${channel.id}`);
                const data = await res.json();

                if (data.status === 'ok') {
                    console.log("Loading stream:", data.url);
                    currentStreamUrl = data.url; // Save for native player
                    player.src = { src: data.url, type: 'application/x-mpegurl' };
                    player.muted = true;
                    player.autoplay = true;
                    player.play();

                    // Start Timeout Timer (20 seconds) to show error if no playback
                    if (loadTimeout) clearTimeout(loadTimeout);
                    loadTimeout = setTimeout(() => {
                        // Check if playing (currentTime is still near zero)
                        if (player.currentTime < 1) {
                            console.warn("Stream timeout - No sources.");
                            errorDiv.style.display = 'flex';
                            player.pause();
                        }
                    }, 20000);

                    // Clear timeout if it starts playing
                    player.addEventListener('playing', () => {
                        if (loadTimeout) clearTimeout(loadTimeout);
                        errorDiv.style.display = 'none';
                    }, { once: true });

                } else {
                    alert("Error servidor: " + data.status);
                    closePlayer();
                }
            } catch (e) {
                console.error(e);
                alert("Error de conexión con el backend");
                closePlayer();
            }
        }

        function playNativeIOS() {
            if (!currentStreamUrl) return alert("Espera a que cargue el stream...");
            // Force full URL location
            const fullUrl = window.location.origin + currentStreamUrl;
            window.location.href = fullUrl;
        }

        function closePlayer() {
            player.pause();
            player.src = ''; // Unload
            currentStreamUrl = "";
            document.getElementById('player-modal').style.display = 'none';
            if (loadTimeout) clearTimeout(loadTimeout);
        }

        function playManual() {
            let id = document.getElementById('manualAceId').value.trim().replace('acestream://', '');
            if (id) playChannel({ id: id, name: 'ID: ' + id });
        }

        // Close modal on click outside
        document.getElementById('player-modal').addEventListener('click', (e) => {
            if (e.target.id === 'player-modal') closePlayer();
        });

        function copyToClipboard(e, el) {
            e.preventDefault();
            const url = el.getAttribute('data-url') || el.href;

            // Robust Copy
            const copyText = (text) => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "fixed"; // Avoid scrolling
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    return new Promise((resolve, reject) => {
                        try {
                            const successful = document.execCommand('copy');
                            document.body.removeChild(textArea);
                            successful ? resolve() : reject();
                        } catch (err) {
                            document.body.removeChild(textArea);
                            reject(err);
                        }
                    });
                }
            };

            copyText(url).then(() => {
                const originalText = el.textContent;
                el.textContent = "✅ ¡Copiado!";
                setTimeout(() => el.textContent = originalText, 2000);
            }).catch(err => {
                console.error('Failed to copy', err);
                prompt("Copia este enlace manualmente:", url);
            });
        }

        document.addEventListener('DOMContentLoaded', loadChannels);
    </script>
</body>

</html>
