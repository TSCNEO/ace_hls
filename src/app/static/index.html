<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceHLS Viewer</title>

    <!-- PWA Support -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">

    <!-- Vidstack Styles & Script -->
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
    <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
    <script src="https://cdn.vidstack.io/player" type="module"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>AceHLS</h1>
        <div class="controls">
            <div class="filter-container">
                <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filterChannels()">
                <select id="categorySelect" onchange="filterChannels()">
                    <option value="all">Todas las categorías</option>
                    <option value="favorites">⭐ Favoritos</option>
                </select>
            </div>
            <div class="filter-container">
                <input type="text" id="manualAceId" placeholder="Pegar AceStream ID manual..." style="flex-grow: 2;">
                <button onclick="playManual()">Reproducir ID</button>
            </div>
            <div class="action-buttons">
                <button onclick="openSettings()" class="theme-btn" title="Configuración">⚙️</button>
                <button onclick="toggleTheme()" class="theme-btn" title="Cambiar Tema" id="theme-icon">🌓</button>
                <button onclick="loadChannels()">Refrescar</button>
                <div class="m3u-dropdown">
                    <button class="icon-btn" onclick="toggleM3UMenu()" title="Descargar Lista">📋 ⏷</button>
                    <div id="m3u-menu" class="dropdown-content">
                        <a href="#" onclick="downloadM3U('direct')">Direct AceStream</a>
                        <div class="divider"></div>
                        <a href="#" onclick="downloadM3U('original')">HLS (Original)</a>
                        <a href="#" onclick="downloadM3U('max_compat')" class="transcode-opt"
                            title="Re-encode H264 (Compatible)">HLS (Compatibilidad)</a>
                        <a href="#" onclick="downloadM3U('720p')" class="transcode-opt">HLS (720p)</a>
                        <a href="#" onclick="downloadM3U('480p')" class="transcode-opt">HLS (480p)</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="favorites-grid" class="favorites-grid" style="display:none;"></div>
        <div id="channel-grid">
            <div class="loading" style="text-align:center;">Cargando canales...</div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeSettings()">&times;</span>
            <h2>Gestión de Fuentes</h2>
            <div class="source-input-group">
                <input type="text" id="newSourceUrl" placeholder="URL lista M3U (ej: https://...)"
                    style="flex-grow:1; padding:8px;">
                <button onclick="addSource()">Añadir</button>
            </div>
            <ul id="sources-list" class="source-list">
                <!-- Sources wil be here -->
            </ul>
            <div class="modal-actions" style="margin-top: 20px; text-align: right;">
                <button onclick="refreshChannelsFromServer()" style="background: var(--primary-color);">Actualizar
                    Canales Ahora</button>
            </div>
        </div>
    </div>

    <!-- Modal with Vidstack -->
    <div id="player-modal">
        <div id="player-container">
            <button class="close-btn" onclick="closePlayer()">&times;</button>
            <h2 id="player-title" style="color:white; margin:0 0 5px 0; text-align: center;"></h2>

            <div class="player-controls-row"
                style="display:flex; justify-content:center; gap:15px; margin-bottom:10px;">
                <div id="player-tech-info" style="min-height:20px;"></div>
                <select id="quality-selector" onchange="changeQuality(this.value)"
                    style="display:none; padding:2px; border-radius:4px; background:#333; color:white; border:1px solid #555;">
                    <option value="original">Original (Passthrough)</option>
                    <option value="max_compat">Compatibilidad (Max)</option>
                    <option value="720p">720p (Transcode)</option>
                    <option value="480p">480p (Transcode)</option>
                </select>
            </div>

            <div id="player-error"
                style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:black; color:white; z-index:10; flex-direction:column; justify-content:center; align-items:center; text-align:center;">
                <div style="font-size:3rem; margin-bottom:10px;">⚠️</div>
                <div style="font-size:1.2rem; font-weight:bold;">Stream no disponible</div>
                <div style="color:#aaa; margin-top:5px;">No hay fuentes (seeds) o el canal está off-line.<br>Prueba otro
                    canal.</div>
            </div>

            <media-player id="player" title="AceHLS Stream" aspect-ratio="16/9" loop playsinline>
                <media-provider></media-provider>
                <media-video-layout></media-video-layout>
            </media-player>

            <div class="utility-box">
                <div class="feedback-controls"
                    style="display:flex; gap:10px; margin-bottom:10px; justify-content:center;">
                    <button id="btn-like" class="feedback-btn" onclick="sendFeedback('like')"
                        title="Funciona bien">👍</button>
                    <button id="btn-dislike" class="feedback-btn" onclick="sendFeedback('dislike')"
                        title="Mala calidad / No funciona">👎</button>
                </div>

                <div><strong>Opciones de Reproducción:</strong></div>

                <!-- iOS Native Button -->
                <button id="ios-btn" class="utility-btn btn-ios" onclick="playNativeIOS()" style="display:none;">
                    Usar Reproductor Nativo
                </button>

                <!-- VLC Copy Button -->
                <a id="vlc-link" href="#" onclick="copyToClipboard(event, this)" class="utility-btn btn-vlc">
                    🔗 Copiar Enlace VLC (Directo)
                </a>
            </div>
        </div>
    </div>

    <footer>
        <small>AceHLS Viewer <span id="version-display"></span></small>
    </footer>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>

</html>
