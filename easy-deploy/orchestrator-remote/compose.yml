name: ace-hls

services:
  ace-hls:
    image: ${ACE_HLS_IMAGE:-tscneo/ace-hls-viewer:2.9.0}
    container_name: ace_hls_viewer
    restart: unless-stopped
    ports:
      - "${ACE_HLS_PORT:-8088}:5000"
    volumes:
      - ace_hls_data:/app/data
    # Descomentar si el host expone VAAPI.
    # devices:
    #   - /dev/dri:/dev/dri
    environment:
      - STREAM_BACKEND=orchestrator
      - ORCHESTRATOR_MODE=remote
      - ORCHESTRATOR_HOST=${ORCHESTRATOR_HOST:?Define ORCHESTRATOR_HOST in .env}
      - ORCHESTRATOR_PORT=${ORCHESTRATOR_PORT:-8000}
      - STREAM_PROXY_HOST=${STREAM_PROXY_HOST:-${ORCHESTRATOR_HOST}}
      - STREAM_PROXY_PORT=${STREAM_PROXY_PORT:-${ORCHESTRATOR_PORT:-8000}}
      - STREAM_PUBLIC_PORT=${STREAM_PUBLIC_PORT:-${ORCHESTRATOR_PORT:-8000}}
      - STREAM_PUBLIC_ENDPOINT=${STREAM_PUBLIC_ENDPOINT:-}
      - CACHE_DURATION=${CACHE_DURATION:-300}
      - PLAYLIST_REFRESH_INTERVAL=${PLAYLIST_REFRESH_INTERVAL:-900}
      - SOURCE_CONNECT_TIMEOUT=${SOURCE_CONNECT_TIMEOUT:-8}
      - SOURCE_READ_TIMEOUT=${SOURCE_READ_TIMEOUT:-30}
      - SOURCE_MAX_BYTES=${SOURCE_MAX_BYTES:-10485760}
      - SOURCE_TLS_VERIFY=${SOURCE_TLS_VERIFY:-false}
      - FFMPEG_RW_TIMEOUT=${FFMPEG_RW_TIMEOUT:-60}
      - HLS_IDLE_TIMEOUT=${HLS_IDLE_TIMEOUT:-120}
      - URL_ORIGEN=${URL_ORIGEN:-}
      - ENABLE_TRANSCODE=${ENABLE_TRANSCODE:-false}
      - TRANSCODE_720P_BITRATE=${TRANSCODE_720P_BITRATE:-2500k}
      - TRANSCODE_480P_BITRATE=${TRANSCODE_480P_BITRATE:-1000k}
      - TRANSCODE_COMPAT_CRF=${TRANSCODE_COMPAT_CRF:-23}
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-}
      - ORCHESTRATOR_API_PREFIX=${ORCHESTRATOR_API_PREFIX:-/api/v1}
      - ORCHESTRATOR_API_TOKEN=${ORCHESTRATOR_API_TOKEN:?Define ORCHESTRATOR_API_TOKEN in .env}
      - ORCHESTRATOR_TIMEOUT=${ORCHESTRATOR_TIMEOUT:-5}

volumes:
  ace_hls_data:
    name: ${ACE_HLS_DATA_VOLUME:-ace_hls_data}
